name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx buf lint
      - name: Check code generation drift
        run: |
          npm run generate
          git diff --exit-code src/gen
      - name: Check protobuf backward compatibility
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          if [ -n "$PREV_TAG" ] && [ -n "$(git ls-tree "$PREV_TAG" proto)" ]; then
            npx buf breaking --against ".git#tag=$PREV_TAG"
          else
            echo "Skipping buf breaking: previous release tag '$PREV_TAG' has no proto/ directory"
          fi
      - run: npm test
      - run: npm pack --dry-run

  notify-consumers:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch validated release
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_REPOS_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api --method POST repos/Nasam-Main/nasam-v2-api/dispatches \
            -f event_type=tenant-rpc-released \
            -F client_payload[tag]="$GITHUB_REF_NAME"
          gh api --method POST repos/Nasam-Main/nasam-portal-backend/dispatches \
            -f event_type=tenant-rpc-released \
            -F client_payload[tag]="$GITHUB_REF_NAME"
